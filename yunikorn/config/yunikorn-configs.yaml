apiVersion: v1
kind: ConfigMap
metadata:
  name: yunikorn-configs
  namespace: yunikorn
data:
  queues.yaml: |
    partitions:
      - name: default
        preemption:
          enabled: true
        placementrules:
        - name: provided
        - name: fixed
          value: default
          create: true
          parent:
            name: tag
            value: namespace
            create: false
            parent:
              name: fixed
              value: root.yunikorn
        queues:
        - name: yunikorn
          submitacl: '*'
          queues:
          - name: yunikorn-spark-operator
            properties:
              priority.offset: "-1000"
            resources:
              guaranteed:
                {memory: 2Gi, vcore: 1000m}
              max:
                {memory: 3Gi, vcore: 1500m}
            queues:
            - name: tenant-1
              resources:
                guaranteed:
                  {memory: 1Gi, vcore: 500m}
          - name: yunikorn-spark-submit
            properties:
              priority.offset: "-1000"
            resources:
              guaranteed:
                {memory: 2Gi, vcore: 1000m}
              max:
                {memory: 3Gi, vcore: 1500m}
            queues:
            - name: tenant-1
              resources:
                guaranteed:
                  {memory: 1Gi, vcore: 500m}