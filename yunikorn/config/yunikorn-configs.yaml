apiVersion: v1
kind: ConfigMap
metadata:
  name: yunikorn-configs
  namespace: yunikorn
data:
  queues.yaml: |
    partitions:
      - name: default
        placementrules:
        - name: provided
        - name: fixed
          value: root.default
        queues:
        - name: root
          queues:
          - name: default
            submitacl: '*'
          - name: ns-a
            resources:
              max:
                {memory: 11000Mi, vcore: 3600m}
            properties:
              preemption.policy: fence
              preemption.delay: 10s
            queues:
            - name: tenant-a
              submitacl: '*'
              resources:
                guaranteed:
                  {memory: 3500Mi, vcore: 1200m}
              properties:
                priority.offset: "0"
            - name: tenant-b
              submitacl: '*'
              resources:
                guaranteed:
                  {memory: 3500Mi, vcore: 1200m}
              properties:
                priority.offset: "0"
            - name: tenant-c
              submitacl: '*'
              resources:
                guaranteed:
                  {memory: 3500Mi, vcore: 1200m}
              properties:
                priority.offset: "1000"