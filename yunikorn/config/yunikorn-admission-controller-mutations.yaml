apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    app: yunikorn
  name: yunikorn-admission-controller-mutations
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: 
    service:
      name: yunikorn-admission-controller-service
      namespace: yunikorn
      path: /mutate
      port: 443
  failurePolicy: Ignore
  matchPolicy: Equivalent
  name: admission-webhook.yunikorn.mutate-pods
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - namespace-1
      - namespace-2
      - namespace-3
  # namespaceSelector:
  #   matchLabels:
  #     kubernetes.io/metadata.name: default
  objectSelector: {}
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - ""
    - apps
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
