apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-diamond-
spec:
  entrypoint: main
  templates:
  - name: echo
    inputs:
      parameters:
      - name: message
    container:
      image: busybox
      command: [echo, "{{inputs.parameters.message}}"]
  
  - name: long-running-pod
    inputs:
      parameters:
      - name: duration
    container:
      image: busybox
      command: [sh, -c]
      args: ["echo 'Pod started'; sleep {{inputs.parameters.duration}}; echo 'Pod ending'"]
  
  - name: diamond
    dag:
      tasks:
      - name: A
        template: echo
        arguments:
          parameters: [{name: message, value: A}]
      - name: B
        dependencies: [A]
        template: echo
        arguments:
          parameters: [{name: message, value: B}]
      - name: C
        dependencies: [A]
        template: echo
        arguments:
          parameters: [{name: message, value: C}]
      - name: D
        dependencies: [B, C]
        template: echo
        arguments:
          parameters: [{name: message, value: D}]
  
  - name: main
    dag:
      tasks:
      - name: long-pod
        template: long-running-pod
        arguments:
          parameters: [{name: duration, value: "3600"}]
      - name: workflow
        template: diamond
        dependencies: [long-pod]
    
    onExit: cleanup
  
  - name: cleanup
    container:
      image: busybox
      command: [echo, "Cleanup running, long-pod still alive"]