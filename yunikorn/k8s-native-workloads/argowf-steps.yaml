apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: steps-
spec:
  entrypoint: main
  arguments:
    parameters:
    - name: count
      value: "10"
    - name: parallelism
      value: "5"
    - name: sleep-seconds
      value: "30"

  templates:
  - name: main
    steps:
    - - name: run-many
        template: sleep-pod
        arguments:
          parameters:
          - name: sleep-seconds
            value: "{{workflow.parameters.sleep-seconds}}"
          - name: pod-id
            value: "{{item}}"
        withSequence:
          count: "{{workflow.parameters.count}}"
  - name: sleep-pod
    inputs:
      parameters:
      - name: sleep-seconds
      - name: pod-id
    metadata:
      labels:
        applicationId: "{{workflow.name}}"
    container:
      image: busybox
      command: [sh, -c]
      args: ["echo 'Pod {{inputs.parameters.pod-id}} sleeping for {{inputs.parameters.sleep-seconds}}s' && sleep {{inputs.parameters.sleep-seconds}}"]
