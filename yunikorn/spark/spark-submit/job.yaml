apiVersion: batch/v1
kind: Job
metadata:
  name: pi
spec:
  template:
    spec:
      containers:
      - name: pi
        image: apache/spark:3.5.7
        imagePullPolicy: Never
        command: ["sh", "-c", "echo 'Computing pi approximation...'; python3 -c 'import math; print(f\"Pi = {math.pi}\")'"]
      restartPolicy: Never
  backoffLimit: 4
