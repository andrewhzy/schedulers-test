apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: spark-pi-wf-
spec:
  entrypoint: spark-pi
  arguments:
    parameters:
    - name: queue
      value: root.default  # default value
    - name: image-name
      value: apache/spark
    - name: tag
      value: 3.5.7
    - name: namespace
      value: argo
  templates:
  - name: spark-pi
    serviceAccountName: spark
    container:
      image: "{{workflow.parameters.image-name}}:{{workflow.parameters.tag}}"
      command: ["/opt/spark/bin/spark-submit"]
      args:
      - --master
      - k8s://https://kubernetes.default.svc:443
      - --deploy-mode
      - cluster
      - --name
      - spark-pi
      - --class
      - org.apache.spark.examples.SparkPi
      - --conf
      - spark.kubernetes.container.image={{workflow.parameters.image-name}}:{{workflow.parameters.tag}}
      - --conf
      - spark.kubernetes.namespace={{workflow.parameters.namespace}}
      - --conf
      - spark.kubernetes.authenticate.driver.serviceAccountName=spark
      - --conf
      - spark.executor.instances=4
      - --conf
      - spark.kubernetes.driver.request.cores=0.2
      - --conf
      - spark.kubernetes.driver.limit.cores=0.5
      - --conf
      - spark.driver.memory=1024m
      - --conf
      - spark.driver.memoryOverhead=200m
      - --conf
      - spark.kubernetes.executor.request.cores=0.2
      - --conf
      - spark.kubernetes.executor.limit.cores=0.5
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.executor.memoryOverhead=100m
      - --conf
      - spark.network.timeout=600s
      - --conf
      - spark.executor.heartbeatInterval=60s
      - --conf
      - spark.scheduler.maxRegisteredResourcesWaitingTime=300s
      - --conf
      - spark.scheduler.minRegisteredResourcesRatio=0.0
      - --conf
      - spark.kubernetes.scheduler.name=yunikorn
      - --conf
      - spark.kubernetes.driver.label.queue={{workflow.parameters.queue}}
      - --conf
      - spark.kubernetes.driver.label.yunikorn.apache.org/allow-preemption=false
      - --conf
      - spark.kubernetes.executor.label.queue={{workflow.parameters.queue}}
      - local:///opt/spark/examples/jars/spark-examples_2.12-{{workflow.parameters.tag}}.jar
      - "100000"
