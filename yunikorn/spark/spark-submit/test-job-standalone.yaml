apiVersion: batch/v1
kind: Job
metadata:
  name: test-job-${JOB_NAME:-$(date +%s)}
  namespace: ${NAMESPACE:-yunikorn-spark-submit}
spec:
  completions: ${REPLICAS:-1}
  parallelism: ${REPLICAS:-1}
  template:
    metadata:
      labels:
        queue: ${QUEUE:-root.default}
        app: test-job
    spec:
      schedulerName: ${SCHEDULER:-default-scheduler}
      serviceAccountName: spark
      restartPolicy: Never
      containers:
      - name: test-container
        image: ${IMAGE:-busybox:1.36}
        command: ["sh", "-c"]
        args:
        - |
          echo "Starting test job in queue ${QUEUE:-root.default}"
          echo "Sleeping for ${SLEEP_DURATION:-300} seconds"
          sleep ${SLEEP_DURATION:-300}
          echo "Test job completed"
        resources:
          requests:
            cpu: ${CPU_REQUEST:-0.2}
            memory: ${MEMORY_REQUEST:-256Mi}
          limits:
            cpu: ${CPU_LIMIT:-0.5}
            memory: ${MEMORY_LIMIT:-512Mi}
