apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: test-job-wf-
spec:
  entrypoint: test-job
  arguments:
    parameters:
    - name: queue
      value: root.default  # default value
    - name: image
      value: busybox:1.36
    - name: namespace
      value: yunikorn-spark-submit
    - name: sleep-duration
      value: "300"  # 5 minutes
    - name: replicas
      value: "1"
    - name: scheduler
      value: default-scheduler
  templates:
  - name: test-job
    resource:
      action: create
      manifest: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: test-job-{{workflow.uid}}
          namespace: {{workflow.parameters.namespace}}
        spec:
          completions: {{workflow.parameters.replicas}}
          parallelism: {{workflow.parameters.replicas}}
          template:
            metadata:
              labels:
                queue: {{workflow.parameters.queue}}
                app: test-job
            spec:
              schedulerName: {{workflow.parameters.scheduler}}
              serviceAccountName: spark
              restartPolicy: Never
              containers:
              - name: test-container
                image: {{workflow.parameters.image}}
                command: ["sh", "-c"]
                args:
                - |
                  echo "Starting test job in queue {{workflow.parameters.queue}}"
                  echo "Sleeping for {{workflow.parameters.sleep-duration}} seconds"
                  sleep {{workflow.parameters.sleep-duration}}
                  echo "Test job completed"
                resources:
                  requests:
                    cpu: "0.2"
                    memory: "256Mi"
                  limits:
                    cpu: "0.5"
                    memory: "512Mi"
