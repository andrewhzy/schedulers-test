apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  generateName: spark-pi-1-
  namespace: default
spec:
  type: Scala
  mode: cluster
  image: spark:3.5.7
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  # mainClass: org.apache.spark.examples.SparkPi
  # mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-v3.5.7.jar
  sparkVersion: 3.5.7
  batchScheduler: volcano # Note: the batch scheduler name must be specified with `volcano`
  restartPolicy:
    type: Never
  volumes:
    - name: test-volume
      hostPath:
        path: /tmp
        type: Directory
  driver:
    cores: 1
    coreLimit: 1200m
    memory: 512m
    labels:
      version: 3.5.7
    serviceAccount: spark
    volumeMounts:
      - name: test-volume
        mountPath: /tmp
  executor:
    cores: 1
    instances: 1
    memory: 512m
    labels:
      version: 3.5.7
    volumeMounts:
      - name: test-volume
        mountPath: "/tmp"